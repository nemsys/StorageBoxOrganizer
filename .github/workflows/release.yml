name: Release

on:
  push:
    branches:
      - main
    # A release must mean the shipped app changed. These paths cannot affect the
    # build, so a push touching only them produces no version bump and no tag —
    # otherwise the version climbs while the changelog entry comes out empty.
    # A mixed push (code + docs) still releases: paths-ignore skips a run only
    # when every changed file matches.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/**'

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run if the commit wasn't created by the bot to avoid infinite loops
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Important: fetch all history for tagging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push changes
        run: git push --follow-tags origin main