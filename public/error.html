<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Storage Box Organizer</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { color: #94a3b8; margin: 0 0 1.5rem; max-width: 22rem; line-height: 1.5; }
    button {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: .75rem;
      padding: .75rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
    }
    button:active { opacity: .85; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Can't reach Storage Box Organizer</h1>
    <p>You appear to be offline, or the server is temporarily unavailable. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>

</html>
